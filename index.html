<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com http://localhost:* http://127.0.0.1:*; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Quotes</title>
<meta name="description" content="Your quote library with Discover. Works offline; syncs through your own Google Drive.">
<meta name="theme-color" content="#8E2C2A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --paper:#F4EEE3; --surface:#FBF8F2; --sunk:#EBE3D5; --raise:#FFFFFF;
  --ink:#221C17; --ink-2:#4A4038; --muted:#7B6F63; --faint:#A89C8D;
  --rule:#DDD2C1; --rule-2:#E7DECF;
  --accent:#8E2C2A; --accent-ink:#FFFFFF; --accent-soft:#F1DED8; --accent-line:#D9B3AA;
  --ok:#3E6B4A; --ok-soft:#DFEBDF; --warn:#8F5F0E; --warn-soft:#F6E7C8; --bad:#A3302C; --bad-soft:#F6DAD6;
  --mark:#F3D98B;
  --sh-1:0 1px 2px rgba(60,40,20,.08); --sh-2:0 8px 28px rgba(60,40,20,.16),0 2px 6px rgba(60,40,20,.08);
  --font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,"Microsoft JhengHei","PingFang TC",sans-serif;
  --font-quote:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU","SimSun",serif;
  --rail:252px; --reader:440px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#16120E; --surface:#1E1914; --sunk:#29221B; --raise:#241E18;
  --ink:#EFE7DA; --ink-2:#CFC3B2; --muted:#9D9081; --faint:#6E6356;
  --rule:#3A3027; --rule-2:#2F271F;
  --accent:#E08A7C; --accent-ink:#1E1914; --accent-soft:#3A2420; --accent-line:#6B3A32;
  --ok:#8CC49A; --ok-soft:#1F3125; --warn:#E5B85C; --warn-soft:#3A2D14; --bad:#F08C84; --bad-soft:#3E1E1B;
  --mark:#6B5418;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --paper:#16120E; --surface:#1E1914; --sunk:#29221B; --raise:#241E18;
  --ink:#EFE7DA; --ink-2:#CFC3B2; --muted:#9D9081; --faint:#6E6356;
  --rule:#3A3027; --rule-2:#2F271F;
  --accent:#E08A7C; --accent-ink:#1E1914; --accent-soft:#3A2420; --accent-line:#6B3A32;
  --ok:#8CC49A; --ok-soft:#1F3125; --warn:#E5B85C; --warn-soft:#3A2D14; --bad:#F08C84; --bad-soft:#3E1E1B;
  --mark:#6B5418;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:11px/1 var(--font-ui);padding:2px 5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--surface)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);height:100vh;height:100dvh}
.app.reading{grid-template-columns:var(--rail) minmax(0,1fr) var(--reader)}
.rail{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule);background:var(--surface)}
.rail-top{padding:18px 16px 10px}
.brand{display:flex;align-items:baseline;gap:8px;margin:0 0 14px 2px;font-family:var(--font-quote);font-size:23px;font-weight:600;letter-spacing:.01em;color:var(--ink)}
.brand .mk{font-size:40px;line-height:0;position:relative;top:13px;color:var(--accent)}
.brand small{font:600 10px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-left:auto}
.capture{width:100%;justify-content:center}
.nav{display:flex;flex-direction:column;gap:2px;padding:4px 10px 10px;border-bottom:1px solid var(--rule-2)}
.nav button{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--ink-2);text-align:left;font-weight:550}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--ink)}
.nav button.on svg{color:var(--accent)}
.nav .ct{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.facets{flex:1;min-height:0;overflow:auto;padding:6px 10px 12px}
.facet h3{display:flex;align-items:center;margin:14px 10px 4px;font:650 10.5px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.facet h3 button{margin-left:auto;border:0;background:none;color:var(--muted);font:600 11px var(--font-ui);letter-spacing:0;text-transform:none;padding:0}
.facet h3 button:hover{color:var(--accent)}
.fct{display:flex;align-items:center;gap:8px;width:100%;min-height:28px;padding:3px 10px;border:0;border-radius:7px;background:none;color:var(--ink-2);text-align:left;font-size:13px}
.fct span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fct .n{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.fct:hover{background:var(--sunk);color:var(--ink)}
.fct.on{background:var(--ink);color:var(--paper)}
.fct.on .n{color:var(--paper);opacity:.7}
.fct.blank span:first-child{font-style:italic;color:var(--muted)}
.fct.on.blank span:first-child{color:var(--paper)}
.rail-foot{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--rule-2)}

/* sync pill */
.pill{display:flex;align-items:center;gap:7px;flex:1;min-width:0;height:32px;padding:0 10px;border:1px solid var(--rule);border-radius:16px;background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:550;text-align:left}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.pill.local .dot{background:var(--faint)}
.pill.busy .dot{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
.pill.off .dot{background:var(--warn)}
.pill.err{border-color:var(--bad);color:var(--bad)} .pill.err .dot{background:var(--bad)}
.pill.conf{border-color:var(--warn);color:var(--warn)} .pill.conf .dot{background:var(--warn)}
.pill:hover{background:var(--sunk)}
@keyframes pulse{50%{opacity:.35}}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border:0;border-radius:9px;background:none;color:var(--ink-2);flex:none}
.ib:hover:not(:disabled){background:var(--sunk);color:var(--ink)}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:560;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover:not(:disabled){background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px;border-radius:7px}
.btn svg{width:16px;height:16px}
.inp,.ta{width:100%;padding:8px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--raise);color:var(--ink);font:inherit}
.inp:focus,.ta:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta{resize:vertical;min-height:92px;line-height:1.5}
.ta.quote{font:18px/1.5 var(--font-quote)}
.field{display:flex;flex-direction:column;gap:5px;margin:0 0 12px}
.field>span{font-size:12px;font-weight:600;color:var(--ink-2)}
.field .hint{margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0}
.hint.ok{color:var(--ok)} .hint.bad{color:var(--bad)} .hint.warn{color:var(--warn)}

/* ---------- main ---------- */
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.mtop{display:none}
.banners:empty{display:none}
.banner{display:flex;align-items:center;gap:12px;padding:9px 22px;border-bottom:1px solid var(--rule);font-size:13px}
.banner.warn{background:var(--warn-soft)} .banner.bad{background:var(--bad-soft)} .banner.info{background:var(--accent-soft)}
.banner b{font-weight:650}
.banner .btn{margin-left:auto}
.view{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth}

/* ---------- discover ---------- */
.disc{max-width:860px;margin:0 auto;padding:34px 40px 60px}
.dhead{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.dhead h1{margin:0;font:600 30px/1.1 var(--font-quote);letter-spacing:-.01em}
.dhead .date{color:var(--muted);font-size:13.5px}
.dots{display:flex;gap:6px;margin-left:auto;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--accent)} .dots i.seen{background:var(--accent-line)}
.dots .lbl{font-size:12px;color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.card{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--sh-1)}
.hero{padding:46px 54px 26px;overflow:hidden}
.hero::before{content:"\201C";position:absolute;left:18px;top:-34px;font:200px/1 var(--font-quote);color:var(--accent);opacity:.12;pointer-events:none}
.hero .via{position:absolute;right:18px;top:14px;font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.qtext{margin:0;font-family:var(--font-quote);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.hero .qtext{position:relative;font-size:var(--qs,30px);line-height:1.42}
.attr{margin:20px 0 0;font-size:15px;color:var(--ink-2)}
.attr .src{color:var(--muted)}
.attr.none{color:var(--faint);font-style:italic;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 10px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);color:var(--ink-2);font-size:12px;font-weight:550}
button.tag:hover{border-color:var(--accent);color:var(--accent)}
.tag.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:26px;padding-top:16px;border-top:1px solid var(--rule-2)}
.acts .sp{flex:1}
.empty{max-width:560px;margin:70px auto;padding:0 30px;text-align:center}
.empty h1{font:600 30px/1.2 var(--font-quote);margin:0 0 10px}
.empty p{color:var(--ink-2);margin:0 0 22px}
.empty .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.empty .big-q{font:120px/0.6 var(--font-quote);color:var(--accent);opacity:.5;margin-bottom:20px}

.sec{margin-top:34px}
.sec h2{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font:650 11px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec h2 .aside{margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none;font-size:12px;color:var(--faint)}
.rel{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rcard{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);text-align:left;color:var(--ink)}
.rcard:hover{border-color:var(--accent-line);box-shadow:var(--sh-1)}
.rcard .qtext{font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.why{font-size:11.5px;color:var(--accent);font-weight:600}
.why::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px;opacity:.7}
.hist{display:flex;flex-direction:column}
.hrow{display:flex;gap:12px;align-items:baseline;padding:7px 4px;border:0;border-bottom:1px solid var(--rule-2);background:none;text-align:left;color:var(--ink-2)}
.hrow:hover{color:var(--ink);background:var(--sunk)}
.hrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-quote);font-size:14.5px}
.hrow .w{font-size:11.5px;color:var(--faint);white-space:nowrap}

/* ---------- library ---------- */
.lib{max-width:900px;margin:0 auto;padding:24px 34px 60px}
.lhead{position:sticky;top:0;z-index:3;margin:-24px -34px 0;padding:20px 34px 12px;background:linear-gradient(var(--paper) 82%,transparent)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .inp{height:44px;padding-left:42px;padding-right:44px;border-radius:12px;font-size:15px;background:var(--surface)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%)}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px}
.ltools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--muted)}
.ltools .n{font-variant-numeric:tabular-nums}
.ltools .sp{flex:1}
.fchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 10px;border-radius:13px;background:var(--ink);color:var(--paper);font-size:12.5px;font-weight:550;border:0}
.fchip svg{width:14px;height:14px;opacity:.7}
.fchip:hover svg{opacity:1}
.qlist{list-style:none;margin:6px 0 0;padding:0}
.qrow{display:block;width:100%;padding:16px 18px;margin:0 0 8px;border:1px solid transparent;border-radius:12px;background:none;text-align:left;color:var(--ink)}
.qrow:hover{background:var(--surface);border-color:var(--rule)}
.qrow.sel{background:var(--surface);border-color:var(--accent-line);box-shadow:inset 3px 0 0 var(--accent)}
.qrow .qtext{font-size:17px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.meta .who{color:var(--ink-2);font-weight:550}
.meta .tg{color:var(--accent)}
.meta .del{color:var(--bad)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.more{display:flex;justify-content:center;margin:14px 0}
.none{padding:50px 10px;text-align:center;color:var(--muted)}

/* ---------- reader ---------- */
.reader{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--rule);background:var(--surface)}
.reader[hidden]{display:none}
.rtop{display:flex;align-items:center;gap:4px;padding:10px 12px;border-bottom:1px solid var(--rule-2)}
.rtop .ttl{font:650 11px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.rtop .sp{flex:1}
.rbody{flex:1;min-height:0;overflow:auto;padding:24px 26px 40px}
.rbody .qtext{font-size:22px;line-height:1.5}
.rbody .attr{font-size:14px}
.note{margin-top:18px;padding:12px 14px;border-left:3px solid var(--accent-line);background:var(--paper);border-radius:0 8px 8px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;color:var(--ink-2)}
.note::before{content:"Note";display:block;font:650 10px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.details{margin-top:18px;font-size:12.5px;color:var(--muted)}
.details summary{cursor:pointer;font-weight:600;color:var(--ink-2)}
.details dl{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:10px 0 0}
.details dt{color:var(--faint)} .details dd{margin:0;overflow-wrap:anywhere;color:var(--ink-2)}
.rbody .rel{grid-template-columns:1fr}
.rbody .rcard .qtext{font-size:14.5px}
.trashnote{margin:0 0 16px;padding:10px 12px;border-radius:9px;background:var(--bad-soft);color:var(--ink);font-size:13px}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(30,20,12,.42);animation:fade .12s ease-out}
@keyframes fade{from{opacity:0}}
.modal{display:flex;flex-direction:column;width:min(560px,100%);max-height:min(90vh,900px);background:var(--surface);border-radius:16px;box-shadow:var(--sh-2);overflow:hidden}
.modal.wide{width:min(760px,100%)}
.mhead{display:flex;align-items:center;gap:10px;padding:16px 18px 10px 22px}
.mhead h2{margin:0;font:600 21px/1.2 var(--font-quote)}
.mhead .ib{margin-left:auto}
.mbody{flex:1;min-height:0;overflow:auto;padding:6px 22px 18px}
.mfoot{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--rule-2);background:var(--paper)}
.mfoot .left{margin-right:auto;font-size:12.5px;color:var(--muted)}
.mtext{margin:0 0 12px;color:var(--ink-2)}
.tabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--rule-2);overflow-x:auto}
.tabs button{height:38px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.box{padding:12px 14px;border:1px solid var(--rule);border-radius:11px;background:var(--paper);margin:0 0 12px}
.box h4{margin:0 0 6px;font-size:13px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.steps{margin:6px 0 0;padding-left:20px;font-size:13px;color:var(--ink-2)}
.steps li{margin:0 0 6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid var(--rule-2);text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--muted);font-size:12px}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}
.tbl tr.zero td{color:var(--faint)} .tbl tr.zero td.n{font-weight:400}
.loglist{font:12px/1.5 ui-monospace,Consolas,monospace;max-height:340px;overflow:auto;padding:10px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);white-space:pre-wrap}
.seg{display:inline-flex;padding:2px;border-radius:9px;background:var(--sunk)}
.seg button{height:28px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--muted);font-weight:600}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.bm{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px dashed var(--accent);border-radius:9px;color:var(--accent);font-weight:650;text-decoration:none;cursor:grab;background:var(--accent-soft)}

/* tag input */
.tagin{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:40px;padding:5px 8px;border:1px solid var(--rule);border-radius:9px;background:var(--raise);position:relative}
.tagin:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tagin .tag{padding-right:4px;gap:2px}
.tagin .tag button{display:inline-grid;place-items:center;width:18px;height:18px;border:0;border-radius:50%;background:none;color:var(--muted);padding:0}
.tagin .tag button:hover{background:var(--sunk);color:var(--bad)}
.tagin .tag svg{width:12px;height:12px}
.tagin input{flex:1;min-width:120px;border:0;outline:0;background:none;color:var(--ink);font:inherit;padding:4px}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:5;max-height:200px;overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:9px;box-shadow:var(--sh-2)}
.sugg button{display:flex;width:100%;gap:8px;padding:7px 12px;border:0;background:none;text-align:left}
.sugg button.on,.sugg button:hover{background:var(--sunk)}
.sugg .n{margin-left:auto;color:var(--faint);font-size:12px}
.dupwarn{display:flex;gap:10px;align-items:center;padding:9px 12px;margin:-4px 0 12px;border-radius:9px;background:var(--warn-soft);font-size:13px}
.dupwarn .btn{margin-left:auto}

/* conflicts */
.cfield{margin:0 0 14px;padding:12px;border:1px solid var(--rule);border-radius:11px}
.cfield h4{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.copt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--rule-2);border-radius:9px;margin-top:6px;cursor:pointer}
.copt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.copt input{margin-top:4px;accent-color:var(--accent)}
.copt .who{font-size:11.5px;font-weight:650;color:var(--muted);display:block}
.copt .val{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-quote);font-size:15px}
.copt .val.empty{font-style:italic;color:var(--faint);font-family:var(--font-ui);font-size:13px}

/* toasts */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:14px;max-width:min(620px,92vw);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--paper);box-shadow:var(--sh-2);font-size:13.5px;pointer-events:auto;animation:rise .16s ease-out}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;padding:4px 6px;border-radius:6px}
:root[data-theme=dark] .toast button{color:var(--accent-ink)}
.toast button:hover{background:rgba(255,255,255,.12)}
@keyframes rise{from{transform:translateY(8px);opacity:0}}

/* ---------- narrow screens ---------- */
@media (max-width:1100px){ .app.reading{grid-template-columns:var(--rail) minmax(0,1fr)} .reader{position:fixed;right:0;top:0;bottom:0;width:min(var(--reader),100vw);z-index:30;box-shadow:var(--sh-2)} }
@media (max-width:760px){
  .app,.app.reading{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .18s ease;box-shadow:var(--sh-2)}
  .app.railopen .rail{transform:none}
  .mtop{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--surface)}
  .mtop .brand{margin:0;font-size:19px} .mtop .brand .mk{font-size:30px;top:9px}
  .disc{padding:20px 16px 50px} .hero{padding:38px 22px 20px} .lib{padding:16px 14px 50px} .lhead{margin:-16px -14px 0;padding:14px 14px 10px}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body>
<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Navigation">
    <div class="rail-top">
      <div class="brand"><span class="mk" aria-hidden="true">“</span>Quotes<small id="build-tag"></small></div>
      <button class="btn primary capture" id="capture-btn" title="Capture a quote (N)"></button>
    </div>
    <nav class="nav">
      <button data-view="discover" id="nav-discover"></button>
      <button data-view="library" id="nav-library"></button>
      <button data-view="trash" id="nav-trash"></button>
    </nav>
    <div class="facets">
      <section class="facet" id="facet-tags"><h3>Tags<button type="button"></button></h3><div class="facet-list"></div></section>
      <section class="facet" id="facet-authors"><h3>Authors<button type="button"></button></h3><div class="facet-list"></div></section>
      <section class="facet" id="facet-sources"><h3>Sources<button type="button"></button></h3><div class="facet-list"></div></section>
    </div>
    <div class="rail-foot">
      <button class="pill local" id="sync-pill" title="Drive sync"><i class="dot"></i><span>Loading…</span></button>
      <button class="ib" id="settings-btn" title="Settings" aria-label="Settings"></button>
    </div>
  </aside>
  <main class="main">
    <div class="mtop"><button class="ib" id="menu-btn" aria-label="Menu"></button><div class="brand"><span class="mk" aria-hidden="true">“</span>Quotes</div><span style="flex:1"></span><button class="ib" id="capture-btn-2" aria-label="Capture"></button></div>
    <div class="banners" id="banners"></div>
    <section class="view" id="view" tabindex="-1"><div class="empty"><p>Opening your library…</p></div></section>
  </main>
  <aside class="reader" id="reader" hidden aria-label="Quote"></aside>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="elsewhere" class="scrim" hidden style="z-index:80"></div>
<input type="file" id="file-in" accept=".json,application/json" hidden>

<script>
const BUILD = "1.0 \u00b7 558f50";
const SYNC_SCRIPT = "/**\n * Quotes sync: keeps the shared copy of your Quotes library in your own Google Drive.\n *\n *   Data file : My Drive / 00_Apps / Quotes / quotes-sync.json\n *   Backups   : My Drive / 00_Apps / Quotes / backups /  (rolling, newest 40 kept; older ones go to Drive Trash)\n *\n * One-time setup\n *   1. Run \"setup\" once (Run button). Allow access when Google asks.\n *   2. Copy the sync key from the Execution log.\n *   3. Deploy > New deployment > Web app. Execute as: Me. Who has access: Anyone.\n *   4. Paste the Web app link (ends in /exec) and the key into Quotes > Drive sync.\n *\n * The script answers only requests that carry your sync key. The key lives in this\n * script's properties, never in the public Quotes page.\n *\n * Each quote is stored as its own record with a revision number. A device sends a changed\n * quote together with the revision it was based on. If the other PC changed that quote in\n * the meantime, the script refuses the write and returns the current copy, so the device\n * can merge field by field and ask you only when the same field was changed on both.\n */\nvar APP = 'quotes-sync', VERSION = 1;\nvar FOLDERS = ['00_Apps', 'Quotes'];\nvar DATA_FILE = 'quotes-sync.json';\nvar BACKUP_FOLDER = 'backups';\nvar KEEP_BACKUPS = 40;\nvar AUTO_BACKUP_HOURS = 20;\n\nfunction setup() {\n  var props = PropertiesService.getScriptProperties();\n  var key = props.getProperty('SYNC_KEY');\n  if (!key) {\n    key = (Utilities.getUuid() + Utilities.getUuid()).replace(/-/g, '');\n    props.setProperty('SYNC_KEY', key);\n  }\n  var file = dataFile_();\n  backupFolder_();\n  Logger.log('Quotes sync is ready.');\n  Logger.log('Sync key: ' + key);\n  Logger.log('Data file: ' + file.getUrl());\n  Logger.log('Next: Deploy > New deployment > Web app (Execute as: Me, Who has access: Anyone). Paste the Web app link and this key into Quotes.');\n}\n\n/* Run this only if a setup link was shared by mistake. Every device then needs the new key. */\nfunction newKey() {\n  PropertiesService.getScriptProperties().deleteProperty('SYNC_KEY');\n  setup();\n}\n\nfunction doGet() {\n  return json_({ ok: true, app: APP, v: VERSION, note: 'Quotes sync is running. Use this link inside Quotes.' });\n}\n\nfunction doPost(e) {\n  var req;\n  try { req = JSON.parse(e.postData.contents); } catch (err) { return json_({ ok: false, error: 'bad_json' }); }\n  var key = PropertiesService.getScriptProperties().getProperty('SYNC_KEY');\n  if (!key || !req || typeof req.key !== 'string' || req.key !== key) return json_({ ok: false, error: 'bad_key' });\n  if (req.op === 'ping') return json_({ ok: true, app: APP, v: VERSION });\n\n  var lock = LockService.getScriptLock();\n  if (!lock.tryLock(25000)) return json_({ ok: false, error: 'busy' });\n  try {\n    if (req.op === 'sync') return json_(sync_(req));\n    if (req.op === 'info') return json_(info_());\n    if (req.op === 'backups') return json_(listBackups_());\n    if (req.op === 'restore') return json_(restore_(req));\n    return json_({ ok: false, error: 'bad_op' });\n  } catch (err) {\n    if (err && err.code) return json_({ ok: false, error: err.code });\n    return json_({ ok: false, error: 'server', detail: String((err && err.message) || err).slice(0, 300) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/* ---------- sync ---------- */\nfunction sync_(req) {\n  var file = dataFile_();\n  var store = readStore_(file);\n  var recs = store.records;\n  var now = Date.now();\n  var device = String(req.device || '').slice(0, 60);\n  var changes = Array.isArray(req.changes) ? req.changes : [];\n  var accepted = [], conflicts = [], apply = [], done = {};\n\n  for (var i = 0; i < changes.length; i++) {\n    var ch = changes[i];\n    if (!ch || typeof ch.id !== 'string' || !ch.id || ch.id.length > 200 || done[ch.id]) continue;\n    done[ch.id] = true;\n    if (!ch.purge && (!ch.data || typeof ch.data !== 'object' || ch.data.id !== ch.id)) continue;\n    var cur = recs[ch.id];\n    var base = ch.baseRev === undefined ? null : ch.baseRev;\n    // A quote new to the Drive copy is accepted. Otherwise the device must have seen the latest revision.\n    if (cur && cur.rev !== base && !(cur.purged && ch.purge)) {\n      conflicts.push({ id: ch.id, rev: cur.rev, purged: !!cur.purged, device: cur.device || '', data: cur.purged ? null : cur.data });\n      continue;\n    }\n    if (!cur && ch.purge) { accepted.push({ id: ch.id, rev: null }); continue; }\n    apply.push(ch);\n  }\n\n  if (apply.length) {\n    var due = !store.lastBackupAt || now - store.lastBackupAt > AUTO_BACKUP_HOURS * 3600 * 1000;\n    if ((req.backup || due) && Object.keys(recs).length) {\n      backup_(file, typeof req.backup === 'string' ? req.backup : 'daily');\n      store.lastBackupAt = now;\n    }\n    for (var j = 0; j < apply.length; j++) {\n      var c = apply[j];\n      store.rev += 1;\n      recs[c.id] = { rev: store.rev, updated: now, device: device, purged: !!c.purge, data: c.purge ? null : c.data };\n      accepted.push({ id: c.id, rev: store.rev });\n    }\n    store.savedAt = new Date(now).toISOString();\n    store.savedBy = device;\n    file.setContent(JSON.stringify(store));\n  }\n\n  var have = req.have && typeof req.have === 'object' ? req.have : {};\n  var skip = {};\n  accepted.forEach(function (a) { skip[a.id] = true; });\n  conflicts.forEach(function (c) { skip[c.id] = true; });\n  var updates = [];\n  Object.keys(recs).forEach(function (id) {\n    var r = recs[id];\n    if (skip[id] || have[id] === r.rev) return;\n    if (r.purged && have[id] === undefined) return;   // nothing to remove on a device that never had it\n    updates.push({ id: id, rev: r.rev, purged: !!r.purged, device: r.device || '', data: r.purged ? null : r.data });\n  });\n  return {\n    ok: true, accepted: accepted, conflicts: conflicts, updates: updates,\n    serverRev: store.rev, count: liveCount_(recs), savedAt: store.savedAt || null, savedBy: store.savedBy || '',\n    lastBackupAt: store.lastBackupAt || null,\n  };\n}\n\nfunction info_() {\n  var file = dataFile_();\n  var store = readStore_(file);\n  return { ok: true, app: APP, v: VERSION, fileUrl: file.getUrl(), count: liveCount_(store.records), serverRev: store.rev,\n    savedAt: store.savedAt || null, savedBy: store.savedBy || '', lastBackupAt: store.lastBackupAt || null };\n}\n\nfunction liveCount_(recs) {\n  var n = 0;\n  Object.keys(recs).forEach(function (id) { var r = recs[id]; if (!r.purged && r.data && !r.data.deleted_at) n++; });\n  return n;\n}\n\n/* ---------- backups ---------- */\nfunction backup_(file, label) {\n  var folder = backupFolder_();\n  var stamp = new Date().toISOString().replace(/:/g, '-').replace(/\\.\\d+Z$/, 'Z');\n  var tag = label ? '_' + String(label).replace(/[^A-Za-z0-9-]/g, '').slice(0, 30) : '';\n  folder.createFile('quotes-sync_' + stamp + tag + '.json', file.getBlob().getDataAsString(), 'application/json');\n  prune_(folder);\n}\n\nfunction backupFiles_(folder) {\n  var files = [], it = folder.getFiles();\n  while (it.hasNext()) {\n    var f = it.next();\n    if (/^quotes-sync_.*\\.json$/.test(f.getName())) files.push(f);\n  }\n  files.sort(function (a, b) { return b.getDateCreated().getTime() - a.getDateCreated().getTime(); });\n  return files;\n}\n\nfunction prune_(folder) {\n  backupFiles_(folder).slice(KEEP_BACKUPS).forEach(function (f) { f.setTrashed(true); });\n}\n\nfunction listBackups_() {\n  var files = backupFiles_(backupFolder_());\n  return { ok: true, backups: files.map(function (f) {\n    return { id: f.getId(), name: f.getName(), size: f.getSize(), created: f.getDateCreated().toISOString() };\n  }) };\n}\n\n/*\n  Restoring makes the Drive copy match a backup without destroying anything:\n  the current copy is backed up first, quotes in the backup come back as they were,\n  and quotes added since that backup move to Trash (restorable), not deleted.\n*/\nfunction restore_(req) {\n  var folder = backupFolder_();\n  var f;\n  try { f = DriveApp.getFileById(String(req.fileId || '')); } catch (err) { return { ok: false, error: 'not_found' }; }\n  var inside = false, parents = f.getParents();\n  while (parents.hasNext()) { if (parents.next().getId() === folder.getId()) inside = true; }\n  if (!inside || !/^quotes-sync_.*\\.json$/.test(f.getName())) return { ok: false, error: 'not_a_backup' };\n  var snap;\n  try { snap = JSON.parse(f.getBlob().getDataAsString()); } catch (err) { return { ok: false, error: 'corrupt_backup' }; }\n  var srecs = (snap && snap.records) || {};\n\n  var file = dataFile_();\n  var store;\n  try { store = readStore_(file); } catch (err) {\n    // The live file is unreadable: start clean from the backup. Revisions jump past anything\n    // a device could hold, so every PC takes the restored copy.\n    store = emptyStore_();\n    store.rev = Math.max(Number(snap && snap.rev) || 0, Date.now());\n  }\n  backup_(file, 'before-restore');\n  var now = Date.now(), iso = new Date(now).toISOString(), restored = 0, trashed = 0;\n  Object.keys(srecs).forEach(function (id) {\n    var b = srecs[id];\n    if (!b || b.purged || !b.data) return;\n    var cur = store.records[id];\n    if (cur && !cur.purged && JSON.stringify(cur.data) === JSON.stringify(b.data)) return;\n    store.rev += 1;\n    store.records[id] = { rev: store.rev, updated: now, device: 'restore', purged: false, data: b.data };\n    restored++;\n  });\n  Object.keys(store.records).forEach(function (id) {\n    var cur = store.records[id];\n    if (cur.purged || !cur.data || cur.data.deleted_at) return;\n    var b = srecs[id];\n    if (b && !b.purged && b.data) return;\n    var d = JSON.parse(JSON.stringify(cur.data));\n    d.deleted_at = iso;\n    store.rev += 1;\n    store.records[id] = { rev: store.rev, updated: now, device: 'restore', purged: false, data: d };\n    trashed++;\n  });\n  store.lastBackupAt = now;\n  store.savedAt = iso;\n  store.savedBy = 'restore';\n  file.setContent(JSON.stringify(store));\n  return { ok: true, restored: restored, trashed: trashed, serverRev: store.rev, from: f.getName() };\n}\n\n/* ---------- storage ---------- */\nfunction emptyStore_() { return { app: APP, schema: 1, rev: 0, records: {} }; }\n\nfunction readStore_(file) {\n  var raw = file.getBlob().getDataAsString();\n  if (!raw || !raw.trim()) return emptyStore_();\n  var s;\n  // Never overwrite a file that can't be read: that would replace your library with nothing.\n  try { s = JSON.parse(raw); } catch (err) { throw { code: 'corrupt_store' }; }\n  if (!s || typeof s !== 'object' || (s.records && typeof s.records !== 'object')) throw { code: 'corrupt_store' };\n  s.records = s.records || {};\n  s.rev = s.rev || 0;\n  s.app = APP; s.schema = 1;\n  return s;\n}\n\nfunction quotesFolder_() {\n  var folder = DriveApp.getRootFolder();\n  FOLDERS.forEach(function (name) {\n    var it = folder.getFoldersByName(name);\n    folder = it.hasNext() ? it.next() : folder.createFolder(name);\n  });\n  return folder;\n}\n\nfunction dataFile_() {\n  var folder = quotesFolder_();\n  var it = folder.getFilesByName(DATA_FILE);\n  if (it.hasNext()) return it.next();\n  return folder.createFile(DATA_FILE, JSON.stringify(emptyStore_()), 'application/json');\n}\n\nfunction backupFolder_() {\n  var parent = quotesFolder_();\n  var it = parent.getFoldersByName(BACKUP_FOLDER);\n  return it.hasNext() ? it.next() : parent.createFolder(BACKUP_FOLDER);\n}\n\nfunction json_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n";
/* ============ Quotes logic: pure functions, no DOM (unit-tested in Node) ============ */
(function (root) {
  'use strict';
  const QL = {};

  /* ---------- small helpers ---------- */
  const clone = v => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  function deepEq(a, b) {
    if (a === b) return true;
    if (a === null || b === null || typeof a !== 'object' || typeof b !== 'object') return false;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    if (Array.isArray(a)) { if (a.length !== b.length) return false; for (let i = 0; i < a.length; i++) if (!deepEq(a[i], b[i])) return false; return true; }
    const ka = Object.keys(a).filter(k => a[k] !== undefined), kb = Object.keys(b).filter(k => b[k] !== undefined);
    if (ka.length !== kb.length) return false;
    for (const k of ka) if (!deepEq(a[k], b[k])) return false;
    return true;
  }
  const pad = n => String(n).padStart(2, '0');
  function isoLocal(d) {
    d = d || new Date();
    const off = -d.getTimezoneOffset(), s = off >= 0 ? '+' : '-', a = Math.abs(off);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}${s}${pad(Math.floor(a / 60))}:${pad(a % 60)}`;
  }
  function hex(n) {
    const c = root.crypto || (typeof require === 'function' ? require('crypto').webcrypto : null);
    const b = new Uint8Array(n); c.getRandomValues(b);
    return [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  const newId = () => 'quote-' + hex(16);
  const ts = s => { const t = Date.parse(s || ''); return isNaN(t) ? 0 : t; };
  const sortKey = q => ts(q.captured_at) || ts(q.created_at);
  const isLive = q => q && !q.deleted_at;
  /* Exact-duplicate test used for imports: case-folded, whitespace-collapsed text. */
  const normText = s => String(s || '').normalize('NFC').toLowerCase().replace(/\s+/g, ' ').trim();
  Object.assign(QL, { clone, deepEq, isoLocal, newId, ts, sortKey, isLive, normText });

  /* ---------- library queries (Flow behaviour) ---------- */
  // Case-insensitive substring across text, author, source, notes and tags; newest first.
  function matches(q, needle) {
    if (!needle) return true;
    const n = needle.toLowerCase();
    return [q.text, q.author, q.source, q.note].some(v => String(v || '').toLowerCase().includes(n)) ||
      (Array.isArray(q.tags) && q.tags.some(t => String(t).toLowerCase().includes(n)));
  }
  function query(list, f) {
    f = f || {};
    const out = list.filter(q => isLive(q) && matches(q, (f.q || '').trim()) &&
      (!f.tag || (Array.isArray(q.tags) && q.tags.includes(f.tag))) &&
      (f.author == null || (q.author || '') === f.author) &&
      (f.source == null || (q.source || '') === f.source));
    out.sort((a, b) => (sortKey(b) - sortKey(a)) || (ts(b.created_at) - ts(a.created_at)) || (a.id < b.id ? -1 : 1));
    if (f.oldest) out.reverse();
    return out;
  }
  function counts(list, pick) {
    const m = new Map();
    for (const q of list) { if (!isLive(q)) continue; for (const v of pick(q)) m.set(v, (m.get(v) || 0) + 1); }
    return [...m.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
  }
  const tagCounts = list => counts(list, q => Array.isArray(q.tags) ? [...new Set(q.tags)] : []);
  const authorCounts = list => counts(list, q => [q.author || '']);
  const sourceCounts = list => counts(list, q => [q.source || '']);
  Object.assign(QL, { matches, query, tagCounts, authorCounts, sourceCounts });

  /* ---------- import ---------- */
  const FLOW_FIELDS = ['id', 'text', 'author', 'source', 'note', 'tags', 'captured_at', 'created_at', 'updated_at', 'legacy_ids', 'legacy_source'];
  function detect(doc) {
    if (doc && Array.isArray(doc.quotes)) return 'flow';
    if (doc && Array.isArray(doc.ideas)) return 'ikes';
    if (Array.isArray(doc) && doc.length && doc.every(x => x && typeof x === 'object' && typeof x.id === 'string' && /^quote-/.test(x.id))) return 'flow-array';
    return null;
  }
  function ikesDate(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') {
      const ms = v > 1e12 ? v : v > 1e9 ? v * 1000 : (v + 978307200) * 1000;   // ms, unix seconds, or Apple reference seconds
      return new Date(ms).toISOString().replace(/\.\d{3}Z$/, 'Z');
    }
    const t = Date.parse(v); return isNaN(t) ? null : String(v);
  }
  function ikesTags(v) {
    const arr = Array.isArray(v) ? v : v ? [v] : [];
    return [...new Set(arr.map(t => typeof t === 'string' ? t : t && (t.name || t.title || t.tag)).filter(t => typeof t === 'string' && t.trim()).map(t => t.trim()))];
  }
  // Ikes idea -> quote fields. Attribution comes only from the idea itself; "You" means your own note, so no author.
  function fromIkes(idea) {
    const legacy = idea.id || idea.uuid || idea.identifier || idea.ideaID || null;
    const text = [idea.text, idea.content, idea.body, idea.title].find(v => typeof v === 'string' && v.trim() !== '');
    const src = idea.source && typeof idea.source === 'object' ? idea.source : idea.person && typeof idea.person === 'object' ? idea.person : null;
    let author = typeof idea.author === 'string' ? idea.author : '';
    if (!author && src && src.name && (src.type === 'person' || !src.type) && src.name !== 'You') author = String(src.name);
    const source = typeof idea.source === 'string' ? idea.source : (src && src.type && src.type !== 'person' && src.name ? String(src.name) : '');
    const out = {
      legacy: legacy ? String(legacy) : null,
      text: text === undefined ? null : text,
      author, source,
      note: typeof idea.note === 'string' ? idea.note : typeof idea.notes === 'string' ? idea.notes : '',
      tags: ikesTags(idea.tags || idea.tag),
      captured_at: ikesDate(idea.createdAt ?? idea.created_at ?? idea.created ?? idea.creationDate ?? idea.date),
    };
    if (src) out.legacy_source = Object.assign({ app: 'ikes' }, clone(src));

/* ---------- storage: IndexedDB (one atomic transaction per save), localStorage if IndexedDB is unavailable ---------- */
const DB_NAME = 'quotes-app', DB_STORE = 'kv';
const Store = {
  db: null, mode: 'idb',
  async open() {
    try {
      if (!('indexedDB' in window)) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      });
    } catch (e) { this.mode = 'ls'; }
  },
  _tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(DB_STORE, mode), st = t.objectStore(DB_STORE);
      let out; const r = fn(st);
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = t.onabort = () => rej(t.error || new Error('transaction failed'));
    });
  },
  async get(k) {
    if (this.mode === 'ls') { const s = localStorage.getItem('quotes.kv.' + k); return s ? JSON.parse(s) : undefined; }
    return this._tx('readonly', st => st.get(k));
  },
  async put(obj) {   // { key: value, ... } written together or not at all
    if (this.mode === 'ls') { for (const [k, v] of Object.entries(obj)) localStorage.setItem('quotes.kv.' + k, JSON.stringify(v)); return; }
    return this._tx('readwrite', st => { let last; for (const [k, v] of Object.entries(obj)) last = st.put(v, k); return last; });
  },
  async del(k) {
    if (this.mode === 'ls') { localStorage.removeItem('quotes.kv.' + k); return; }
    return this._tx('readwrite', st => st.delete(k));
  },
  async keys() {
    if (this.mode === 'ls') return Object.keys(localStorage).filter(k => k.startsWith('quotes.kv.')).map(k => k.slice(10));
    return this._tx('readonly', st => st.getAllKeys());
  },
};
const LS_UI = 'quotes.ui.v1';   // this PC only: display settings, Discover history

/* ---------- state ---------- */
const App = {

  view: 'discover', filter: { q: '', tag: null, author: null, source: null, oldest: false },
  readerId: null, libLimit: 200, sel: null,

  audit: [], log: [],
  ui: { theme: 'auto', dailyN: 5, excludeTags: [], hist: {}, recent: [], daily: null, facetAll: {} },
  saveOK: true, booted: false, readFailed: false, owner: false, index: null, undo: null, tab: Math.random().toString(36).slice(2),

const live = () => [...App.quotes.values()].filter(QL.isLive);
const trashed = () => [...App.quotes.values()].filter(q => q.deleted_at).sort((a, b) => QL.ts(b.deleted_at) - QL.ts(a.deleted_at));
function getIndex() { if (!App.index) App.index = QL.buildIndex([...App.quotes.values()]); return App.index; }

function logEvent(kind, msg) {

function loadUI() {

}

function snapshot() {
  return { v: 1, savedAt: Date.now(), quotes: [...App.quotes.values()], sync: App.sync, audit: App.audit.slice(0, 200), log: App.log.slice(0, 300) };
}
function applyState(s) {
  App.quotes = new Map((s && Array.isArray(s.quotes) ? s.quotes : []).filter(q => q && typeof q.id === 'string').map(q => [q.id, q]));
  const d = { url: '', key: '', device: '', base: {}, baseData: {}, dirty: {}, purge: {}, conflicts: {}, lastSync: 0, server: null };
  App.sync = Object.assign(d, (s && s.sync) || {});
  if (!App.sync.device) App.sync.device = deviceGuess();

async function loadState() { applyState(await Store.get('state')); }

let saveTimer = 0, saving = null, bc = null;
/* Writes start in the same moment as the change (batched per task), so a reload or a closed
   window right after an edit can't lose it to a pending timer. */
let savePending = false;
function saveSoon() { if (savePending) return; savePending = true; saveTimer = 1; Promise.resolve().then(() => { savePending = false; saveNow(); }); }
async function saveNow() {
  saveTimer = 0;
  if (App.readFailed || !App.owner) return;   // never overwrite stored quotes we couldn't read, or from a tab that isn't in charge
  const snap = snapshot();
  const p = (async () => {
    try {
      await Store.put({ state: snap });
      if (!App.saveOK) logEvent('save', 'Saving works again.');
      App.saveOK = true;
      if (bc) bc.postMessage({ t: 'saved', from: App.tab });
    } catch (e) {
      App.saveOK = false;
      logEvent('error', 'This browser refused to save: ' + (e && e.message || e));
    }
    updatePill();
  })();
  saving = p; await p;
}
async function flush() { if (savePending) await saveNow(); else if (saving) await saving; }

/* Local backups: whole-library copies kept on this PC before bulk changes. */
async function localBackup(reason) {
  const key = 'backup:' + new Date().toISOString();
  const quotes = [...App.quotes.values()];
  try {
    await Store.put({ [key]: { at: Date.now(), reason, count: quotes.filter(QL.isLive).length, quotes } });
    const keys = (await Store.keys()).filter(k => String(k).startsWith('backup:')).sort().reverse();
    for (const k of keys.slice(12)) await Store.del(k);
    logEvent('backup', `Backup on this PC (${reason}): ${plural(quotes.length, 'quote')}.`);
    return key;
  } catch (e) {
    logEvent('error', 'Could not save a backup on this PC: ' + (e && e.message || e));
    return null;
  }
}
async function listLocalBackups() {
  const keys = (await Store.keys()).filter(k => String(k).startsWith('backup:')).sort().reverse();
  const out = [];
  for (const k of keys) { const b = await Store.get(k); if (b) out.push({ key: k, at: b.at, reason: b.reason, count: b.count, total: (b.quotes || []).length }); }
  return out;
}

/* ---------- record operations: every change marks the quote for sync ---------- */
function deviceGuess() {
  const ua = navigator.userAgent || '';
  const kind = /Windows/.test(ua) ? 'Windows PC' : /Mac/.test(ua) ? 'Mac' : /iPhone|iPad/.test(ua) ? 'iPhone' : /Android/.test(ua) ? 'Android' : 'Device';
  return kind + ' ' + Math.random().toString(36).slice(2, 5).toUpperCase();
}
function touched(id) {
  App.sync.dirty[id] = 1;
  delete App.sync.purge[id];
}
function changed(opts = {}) {
  App.index = null;
  saveSoon();
  if (!opts.noSync) syncSoon(2500);
  if (!opts.noRender) render();
}
function putQuote(rec) { App.quotes.set(rec.id, rec); touched(rec.id); }
/* Apply fn to a copy; nothing happens if it ends up identical. Returns the new record or null. */
function editQuote(id, fn) {
  const cur = App.quotes.get(id); if (!cur) return null;
  const next = QL.clone(cur); fn(next);
  if (QL.deepEq(next, cur)) return null;
  next.updated_at = QL.isoLocal();
  putQuote(next);
  return next;
}
function purgeQuote(id) {
  App.quotes.delete(id);
  delete App.sync.dirty[id];
  delete App.sync.conflicts[id];
  if (App.sync.base[id] !== undefined) App.sync.purge[id] = App.sync.base[id];
}
/* Undo works by putting back the records as they were (a fresh edit, so it syncs too). */
function remember(label, befores) { App.undo = { label, befores }; }
function undo() {
  const u = App.undo; if (!u) return;
  App.undo = null;
  for (const { id, before } of u.befores) {
    if (!before) { if (App.quotes.has(id)) purgeQuote(id); continue; }
    const rec = QL.clone(before);
    if (App.quotes.has(id) || App.sync.base[id] !== undefined) rec.updated_at = QL.isoLocal();
    putQuote(rec);
  }
  logEvent('edit', 'Undid: ' + u.label);
  changed();
  toast('Undone.');
}
function trashQuote(id) {
  const before = QL.clone(App.quotes.get(id));
  if (!editQuote(id, r => { r.deleted_at = QL.isoLocal(); })) return;
  remember('move to Trash', [{ id, before }]);
  if (App.readerId === id) closeReader(true);
  changed();
  toast('Moved to Trash.', { undo: true, action: { label: 'Open Trash', fn: () => setView('trash') } });
}
function restoreQuote(id) {
  const before = QL.clone(App.quotes.get(id));
  if (!editQuote(id, r => { delete r.deleted_at; })) return;
  remember('restore', [{ id, before }]);
  changed();
  toast('Restored to the library.', { undo: true });
}
async function purgeForever(ids) {
  if (!ids.length) return;
  await localBackup(ids.length === 1 ? 'before deleting a quote forever' : 'before emptying Trash');
  const befores = ids.map(id => ({ id, before: QL.clone(App.quotes.get(id)) }));
  ids.forEach(purgeQuote);
  remember(ids.length === 1 ? 'delete forever' : 'empty Trash', befores);
  logEvent('edit', `Deleted ${plural(ids.length, 'quote')} forever.`);
  changed();
  toast(ids.length === 1 ? 'Deleted forever.' : `Deleted ${plural(ids.length, 'quote')} forever.`, { undo: true });
}
function copyQuote(q) {
  const who = [q.author, q.source].filter(Boolean).join(', ');
  copyText(q.text + (who ? '\n— ' + who : ''), 'Quote copied.');
}
async function copyText(t, msg) {
  try { await navigator.clipboard.writeText(t); toast(msg || 'Copied.'); }
  catch (e) {
    const ta = h('textarea', { style: { position: 'fixed', opacity: '0' } }); ta.value = t; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); toast(msg || 'Copied.'); } catch (e2) { toast('Couldn’t copy. Select the text and press Ctrl+C.'); }
    ta.remove();

}
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type || 'application/json' }));
  const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ============ Drive sync: this PC first, then your own Apps Script and Drive file ============ */
/*
  Every change is saved on this PC at once, so the app works with no internet.
  The shared copy is one JSON file in your Google Drive (00_Apps/Quotes/quotes-sync.json),
  kept by a small Apps Script in your account that answers only requests carrying your key.
  Each quote is its own record with a revision number. Changes to different quotes never
  collide. If the same quote changed on both PCs, fields are merged one by one; only a field
  changed on both sides to different values is held back and shown to you to choose.
*/
const Sync = { busy: false, again: false, timer: 0, err: null, detail: '', fails: 0, backupLabel: null, notes: [] };
const syncReady = () => !!(App.sync.url && App.sync.key);
const pendingCount = () => Object.keys(App.sync.dirty).filter(id => !App.sync.conflicts[id]).length + Object.keys(App.sync.purge).length;
const conflictCount = () => Object.keys(App.sync.conflicts).length;
const validScriptUrl = url => /^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(url) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(url);
function syncSoon(ms) { clearTimeout(Sync.timer); if (syncReady()) Sync.timer = setTimeout(() => syncNow(false), ms); }

async function syncCall(body, url) {
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const t = setTimeout(() => ctl && ctl.abort(), 45000);
  try {
    const res = await fetch(url || App.sync.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow', signal: ctl ? ctl.signal : undefined });
    let out;
    try { out = await res.json(); } catch (e) { throw Object.assign(new Error('not_json'), { code: 'not_json' }); }
    if (!out || !out.ok) throw Object.assign(new Error((out && out.error) || 'server'), { code: (out && out.error) || 'server', detail: out && out.detail });
    return out;
  } catch (e) {
    if (!e.code) e.code = e.name === 'AbortError' ? 'timeout' : 'network';
    throw e;
  } finally { clearTimeout(t); }
}
function syncErrText(code, detail) {
  return {
    bad_key: 'The sync key doesn’t match your Quotes sync script',
    not_json: 'The link didn’t answer like the Quotes sync script. Check the Web app link, and that access is set to “Anyone”',
    timeout: 'Google took too long to answer; will retry', network: 'Couldn’t reach Google; will retry', offline: 'You’re offline',
    busy: 'The other PC was syncing at the same moment; will retry',
    corrupt_store: 'The Drive data file can’t be read. Nothing was overwritten. Restore a Drive backup (Settings › Backups)',
    not_a_backup: 'That file isn’t one of the Quotes backups', corrupt_backup: 'That backup file can’t be read', not_found: 'That backup no longer exists',
  }[code] || ('Server said: ' + code + (detail ? ' (' + detail + ')' : ''));
}

/* Bring one quote from the Drive copy into this PC, merging with local edits when there are any. */
function reconcile(id, rev, theirs, purged, device, stats) {
  const S = App.sync, local = App.quotes.get(id), dirty = !!S.dirty[id];
  if (purged) {
    if (dirty && local) {   // deleted forever on the other PC, edited here: keep it
      S.base[id] = rev; S.baseData[id] = null; delete S.conflicts[id]; stats.kept.push(local.text);
      return;
    }
    App.quotes.delete(id);
    delete S.base[id]; delete S.baseData[id]; delete S.dirty[id]; delete S.conflicts[id]; delete S.purge[id];
    stats.changed++;
    return;
  }
  if (S.purge[id] !== undefined) {   // deleted forever here, edited on the other PC: keep their version
    delete S.purge[id];
    App.quotes.set(id, theirs); S.base[id] = rev; S.baseData[id] = theirs;
    stats.kept.push(theirs.text); stats.changed++;
    return;
  }
  if (!dirty || !local) {
    App.quotes.set(id, theirs); S.base[id] = rev; S.baseData[id] = theirs; delete S.conflicts[id];
    stats.changed++;
    return;
  }
  const open = S.conflicts[id];
  const base = open ? open.base : S.baseData[id];
  const mine = open ? open.mine : local;
  const { merged, clashes } = QL.merge3(base, mine, theirs);
  S.base[id] = rev; S.baseData[id] = theirs;
  App.quotes.set(id, merged);
  stats.changed++;
  if (clashes.length) {
    S.conflicts[id] = { at: Date.now(), device: device || 'the other PC', base: base || null, mine, theirs, fields: clashes };
    stats.clashed++;
  } else {
    delete S.conflicts[id];
    if (QL.deepEq(merged, theirs)) delete S.dirty[id];
    stats.merged++;
  }
}

async function syncNow(manual) {
  const S = App.sync;
  if (!syncReady()) { updatePill(); if (manual) openSettings('sync'); return; }
  if (Sync.busy) { Sync.again = true; return; }
  if (navigator.onLine === false) { Sync.err = 'offline'; updatePill(); if (manual) toast('You’re offline. Everything is saved on this PC and will sync when you’re back online.'); return; }
  Sync.busy = true; updatePill();
  const sent = new Map(), changes = [];
  const stats = { changed: 0, merged: 0, clashed: 0, kept: [], up: 0, down: 0 };
  try {
    for (const id of Object.keys(S.dirty)) {
      if (S.conflicts[id]) continue;   // held back until you choose
      const r = App.quotes.get(id);
      if (!r) { delete S.dirty[id]; continue; }
      sent.set(id, JSON.stringify(r));
      changes.push({ id, baseRev: S.base[id] === undefined ? null : S.base[id], data: r });
    }
    const purging = Object.entries(S.purge);
    for (const [id, rev] of purging) changes.push({ id, baseRev: rev, purge: true });
    const req = { op: 'sync', v: 1, key: S.key, device: S.device, changes, have: Object.assign({}, S.base) };
    if (Sync.backupLabel) req.backup = Sync.backupLabel;
    const out = await syncCall(req);
    Sync.backupLabel = null;
    for (const a of out.accepted || []) {
      if (!sent.has(a.id)) {   // a removal went through
        if (S.purge[a.id] !== undefined) { delete S.purge[a.id]; delete S.base[a.id]; delete S.baseData[a.id]; stats.up++; }
        continue;
      }
      S.base[a.id] = a.rev; S.baseData[a.id] = JSON.parse(sent.get(a.id)); stats.up++;
      const r = App.quotes.get(a.id);
      if (r && JSON.stringify(r) === sent.get(a.id)) delete S.dirty[a.id];   // edited again during the call: stays queued
    }
    for (const c of out.conflicts || []) reconcile(c.id, c.rev, c.data, c.purged, c.device, stats);
    for (const u of out.updates || []) { reconcile(u.id, u.rev, u.data, u.purged, u.device, stats); stats.down++; }
    S.server = { count: out.count, savedAt: out.savedAt, savedBy: out.savedBy, lastBackupAt: out.lastBackupAt, rev: out.serverRev };
    Sync.err = null; Sync.detail = ''; Sync.fails = 0; S.lastSync = Date.now();
    if (stats.up || stats.down || stats.clashed) logEvent('sync', `Synced: ${stats.up} sent, ${stats.down} received${stats.merged ? `, ${stats.merged} merged` : ''}${stats.clashed ? `, ${stats.clashed} need your choice` : ''}.`);
  } catch (e) {
    Sync.err = (e && e.code) || 'network'; Sync.detail = (e && e.detail) || '';
    Sync.fails++;
    if (!['offline', 'network', 'timeout', 'busy'].includes(Sync.err) || Sync.fails === 1) logEvent('error', 'Sync failed: ' + syncErrText(Sync.err, Sync.detail) + '.');
  } finally {
    Sync.busy = false;
    if (stats.changed) App.index = null;
    await saveNow();
    if (stats.changed) render(); else updatePill();
    if (stats.clashed) toast(`${plural(stats.clashed, 'quote')} changed on both PCs in the same place. Choose which version to keep.`, { ms: 10000, action: { label: 'Resolve', fn: openConflicts } });
    if (stats.kept.length) toast(`${plural(stats.kept.length, 'quote')} deleted on one PC but edited on the other ${stats.kept.length === 1 ? 'was' : 'were'} kept.`, { ms: 9000 });
    if (manual && !Sync.err) toast(stats.down || stats.up ? `Synced: ${stats.up} sent, ${stats.down} received.` : 'Up to date with Drive.');
    if (manual && Sync.err) toast('Sync failed: ' + syncErrText(Sync.err, Sync.detail) + '.', { ms: 9000 });
    if (Sync.again) { Sync.again = false; syncSoon(400); }
    else if (Sync.err === 'bad_key' || Sync.err === 'corrupt_store') { }
    else if (pendingCount() && Sync.err) syncSoon(Math.min(300000, 15000 * Math.pow(2, Math.min(Sync.fails, 4))));
    else if (pendingCount()) syncSoon(1200);
  }
}

function syncInit() {
  window.addEventListener('online', () => { if (['offline', 'network', 'timeout'].includes(Sync.err)) Sync.err = null; updatePill(); syncNow(false); });

function applyTheme() { const t = App.ui.theme; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; }

/* ============ Boot ============ */
/* One tab is in charge at a time, so two tabs can never overwrite each other's saves. */
let releaseLock = null;
function holdLock(wait) {

    let signal; try { signal = AbortSignal.timeout(1500); } catch (e) { signal = undefined; }

}
function showElsewhere(text, btn, fn) {

    h('div', { style: { font: '64px/0.7 var(--font-quote)', color: 'var(--accent)', marginBottom: '10px' }, text: '“' }),
    h('p', { class: 'mtext', text }), h('button', { class: 'btn primary', text: btn, onclick: fn })));

async function boot() {

    if (e.data.t === 'takeover' && App.owner) {
      await flush();

      showElsewhere('Quotes is now open in another tab or window.', 'Use it here instead', () => location.reload());
    }
  };
  if (!await holdLock(false)) {
    showElsewhere('Quotes is already open in another tab or window. Using two at once could overwrite changes.', 'Use it here instead', async () => {
      if (bc) bc.postMessage({ t: 'takeover', from: App.tab });

function bindUI() {
